<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청룡 비하인드 앨범</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --W: 820px; --H: 1240px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #111; overflow: hidden; }
  body.render { background: #000; }

  /* ── 1080×1920 무대 ─────────────────────────── */
  #stage {
    position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
    overflow: hidden; transform-origin: 0 0;
    font-family: 'Noto Sans KR', sans-serif;
  }
  #bg { position: absolute; inset: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
  .spark { position: absolute; border-radius: 50%; background: #fff; }

  #scene {
    position: absolute; inset: 0;
    perspective: 2600px; perspective-origin: 540px 820px;
  }
  #book {
    position: absolute; left: calc((1080px - var(--W)) / 2); top: 330px;
    width: var(--W); height: var(--H);
    transform-style: preserve-3d; transform-origin: 50% 50%;
  }
  #book > * { position: absolute; transform-style: preserve-3d; }

  .floor { left: -120px; top: -60px; width: calc(var(--W) + 260px); height: calc(var(--H) + 160px);
    background: radial-gradient(ellipse at 50% 55%, rgba(20,40,35,.38), rgba(20,40,35,.18) 45%, rgba(0,0,0,0) 70%); }
  .board { left: 0; top: -14px; width: calc(var(--W) + 18px); height: calc(var(--H) + 28px);
    border-radius: 4px 14px 14px 4px; }
  .edge-r { top: 0; height: var(--H); transform-origin: 0 50%;
    background: repeating-linear-gradient(90deg, #efe6d0 0 2px, #d9cdb0 2px 3px); }
  .edge-t { left: 0; width: var(--W); transform-origin: 50% 0;
    background: repeating-linear-gradient(0deg, #efe6d0 0 2px, #d6caad 2px 3px); }

  .leaf { left: 0; top: 0; width: var(--W); height: var(--H); transform-origin: 0 50%; }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .face.back { transform: rotateY(180deg); }
  .shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .face.front .shade { background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,.15) 60%, rgba(0,0,0,.05)); }
  .face.back  .shade { background: linear-gradient(270deg, rgba(0,0,0,.45), rgba(0,0,0,.08)); }
  .cast { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,.18) 35%, rgba(0,0,0,0) 75%); }

  /* ── 속지 ─────────────────────────────────── */
  .paper { position: absolute; inset: 0; background: var(--paper);
    border-radius: 0 8px 8px 0; }
  .paper::before { content: ""; position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .48  0 0 0 0 .38  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .paper::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 70px;
    background: linear-gradient(90deg, rgba(0,0,0,.16), rgba(0,0,0,0)); }
  .paper.back-side::after { left: auto; right: 0; background: linear-gradient(270deg, rgba(0,0,0,.16), rgba(0,0,0,0)); }

  .phead { position: absolute; left: 70px; right: 60px; top: 46px; display: flex; justify-content: space-between;
    font: 700 22px 'Noto Sans KR'; letter-spacing: .18em; color: var(--accent); opacity: .7; }
  .phead .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-right: 10px; vertical-align: middle; }

  .polaroid { position: absolute; left: 50%; top: 110px; width: 700px; padding: 22px 22px 60px;
    background: #fff; box-shadow: 0 14px 30px rgba(60,45,20,.22), 0 2px 4px rgba(0,0,0,.12); }
  .photo { width: 656px; height: 600px; overflow: hidden; background: #ddd; position: relative; }
  .photo img, .photo video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .vtag { position: absolute; right: 14px; top: 14px; font: 700 20px 'Noto Sans KR'; color: #fff;
    background: rgba(0,0,0,.45); padding: 6px 14px; border-radius: 30px; letter-spacing: .1em; }
  .tape { position: absolute; top: -24px; left: 50%; width: 190px; height: 52px; margin-left: -95px;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,.25) 0 10px, rgba(255,255,255,0) 10px 20px), var(--tape);
    opacity: .82; transform: rotate(-3deg); box-shadow: 0 2px 4px rgba(0,0,0,.08); }

  .ptext { position: absolute; left: 80px; right: 70px; top: 880px; }
  .ptitle { font: 400 70px/1.15 'Black Han Sans', 'Noto Sans KR'; color: var(--accent); letter-spacing: -.01em; }
  .prule { height: 6px; width: 120px; margin: 22px 0 22px; border-radius: 3px; background: var(--gold); transform-origin: 0 50%; }
  .pbody { font: 400 46px/1.38 'Gaegu', 'Noto Sans KR'; color: var(--ink); white-space: pre-line; }
  .pno { position: absolute; right: 64px; bottom: 44px; font: 700 26px 'Noto Sans KR'; color: #9b917c; letter-spacing: .12em; }
  .pno b { color: var(--accent); font-weight: 900; }

  .backdeco { position: absolute; inset: 0; opacity: .35;
    background-image: radial-gradient(circle, rgba(42,127,111,.35) 1.6px, transparent 2px); background-size: 34px 34px; }
  .backmark { position: absolute; left: 0; right: 0; top: 50%; text-align: center; transform: translateY(-50%);
    font: 400 64px 'Black Han Sans'; color: var(--accent); opacity: .12; letter-spacing: .1em; }

  /* ── 표지 ─────────────────────────────────── */
  .cover-face { position: absolute; left: 0; top: -14px; width: calc(var(--W) + 18px); height: calc(var(--H) + 28px);
    border-radius: 4px 14px 14px 4px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, rgba(0,0,0,.035) 2px 4px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, rgba(0,0,0,.03) 2px 4px),
      radial-gradient(ellipse at 30% 25%, rgba(255,255,255,.16), rgba(0,0,0,0) 60%),
      linear-gradient(160deg, var(--cover), var(--coverDark)); }
  .cover-face.back { transform: rotateY(180deg); }
  .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 58px;
    background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.08) 70%, rgba(0,0,0,.25)); }
  .frame { position: absolute; left: 100px; right: 50px; top: 60px; bottom: 60px; border: 3px solid var(--gold); border-radius: 6px; }
  .frame::after { content: ""; position: absolute; inset: 12px; border: 1.5px solid var(--gold); opacity: .7; border-radius: 3px; }
  .ctext { position: absolute; left: 100px; right: 50px; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; text-align: center; color: var(--gold); }
  .ckicker { margin-top: 170px; font: 700 26px 'Noto Sans KR'; letter-spacing: .42em; opacity: .9; }
  .cemblem { margin-top: 70px; width: 260px; height: 260px; }
  .ctitle { margin-top: 60px; font: 400 130px/1.05 'Black Han Sans'; text-shadow: 0 2px 0 rgba(0,0,0,.25), 0 0 30px rgba(233,196,106,.25);
    background: linear-gradient(100deg, var(--gold) 0%, var(--gold) 40%, #fff6d8 50%, var(--gold) 60%, var(--gold) 100%);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
  .csub { margin-top: 26px; font: 700 50px 'Noto Sans KR'; letter-spacing: .12em; }
  .corg { position: absolute; bottom: 130px; font: 700 30px 'Noto Sans KR'; letter-spacing: .04em; opacity: .95; }
  .cyear { position: absolute; bottom: 88px; font: 400 26px 'Noto Sans KR'; letter-spacing: .4em; opacity: .75; }
  .endpaper { position: absolute; inset: 0; background-color: #d7ebe2;
    background-image: radial-gradient(circle at 25% 25%, rgba(29,92,87,.22) 9px, transparent 10px),
                      radial-gradient(circle at 75% 75%, rgba(233,196,106,.45) 7px, transparent 8px);
    background-size: 80px 80px; }

  /* ── 마지막 페이지 ─────────────────────────── */
  .outro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 70px; }
  .otitle { font: 400 128px 'Black Han Sans'; color: var(--accent); letter-spacing: .04em; }
  .obody { margin-top: 40px; font: 400 54px/1.4 'Gaegu'; color: var(--ink); white-space: pre-line; }
  .osign { margin-top: 70px; font: 700 28px 'Noto Sans KR'; color: #8a816d; letter-spacing: .06em; }
  .stamp { margin-top: 70px; width: 210px; height: 210px; border-radius: 50%; border: 6px solid #c4524f; color: #c4524f;
    display: flex; flex-direction: column; align-items: center; justify-content: center; font: 400 44px 'Black Han Sans'; line-height: 1.1; transform: rotate(-12deg); }
  .stamp small { font: 700 18px 'Noto Sans KR'; letter-spacing: .2em; margin-top: 6px; }

  /* ── 상단 라벨 / 페이드 ──────────────────────── */
  #toplabel { position: absolute; top: 150px; left: 0; right: 0; text-align: center; }
  #toplabel span { display: inline-block; padding: 14px 30px; border-radius: 40px; background: rgba(255,255,255,.7);
    font: 700 30px 'Noto Sans KR'; color: #1d5c57; letter-spacing: .02em; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  #fade { position: absolute; inset: 0; background: #000; pointer-events: none; }

  /* ── 미리보기 컨트롤 (렌더 때는 숨김) ───────────── */
  #ctrl { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; display: flex; gap: 12px; align-items: center;
    background: rgba(0,0,0,.75); color: #eee; font: 14px sans-serif; z-index: 10; }
  #ctrl button { padding: 6px 14px; border: 0; border-radius: 6px; background: #2a7f6f; color: #fff; font-weight: 700; cursor: pointer; }
  #ctrl input { flex: 1; }
  body.render #ctrl { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="scene"><div id="book"></div></div>
  <div id="toplabel"><span></span></div>
  <div id="fade"></div>
</div>
<div id="ctrl"><button id="play">⏸</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="tc">0.0s</span></div>

<script src="content.js"></script>
<script>
(() => {
  const A = window.ALBUM;
  const R = window.RENDER || null;            // render.js 가 주입 (프레임 단위 렌더 모드)
  const isRender = !!R || /[?&]render/.test(location.search);
  if (isRender) document.body.classList.add('render');
  const TH = A.theme, TM = A.timing;
  const stage = document.getElementById('stage');
  for (const [k, v] of Object.entries(TH)) stage.style.setProperty('--' + k, v);

  const W = 820, H = 1240;
  const TAPES = ['#f4a261aa', '#8ecae6cc', '#e9c46acc', '#b5e48ccc', '#f28482aa'];
  const isVideo = s => /\.(mp4|mov|webm|m4v)$/i.test(s);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const eout = p => 1 - Math.pow(1 - p, 3);
  const eback = p => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  const pad = (n, l = 2) => String(n).padStart(l, '0');
  const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  // ── 배경 ─────────────────────────────────────
  const bg = document.getElementById('bg');
  bg.style.background = `linear-gradient(180deg, ${TH.bgTop}, ${TH.bgBottom})`;
  const blobs = [[160, 300, 520, '#9fd8c3'], [900, 520, 460, '#f6d58e'], [220, 1500, 560, '#f3b7a4'], [880, 1650, 480, '#a7c7e7']]
    .map(([x, y, s, c]) => { const b = el('div', 'blob'); Object.assign(b.style, { width: s + 'px', height: s + 'px', background: c }); bg.appendChild(b); return { b, x, y, s }; });
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const sparks = Array.from({ length: 26 }, () => { const s = el('div', 'spark'); bg.appendChild(s);
    return { s, x: rnd() * 1080, y: rnd() * 1920, r: 4 + rnd() * 9, sp: 30 + rnd() * 60, ph: rnd() * 6.28, o: .25 + rnd() * .45 }; });

  document.querySelector('#toplabel span').textContent = A.topLabel || '';
  if (!A.topLabel) document.getElementById('toplabel').style.display = 'none';

  // ── 책 만들기 ─────────────────────────────────
  const book = document.getElementById('book');
  const pages = A.pages.map((p, i) => ({ ...p, page: p.page ?? i + 1, video: isVideo(p.media) }));
  const L = pages.length + 2;                     // 표지 + 페이지들 + 마지막장
  const K = 1.6;                                  // 장 사이 두께(px)
  const T = L * K + 6;                            // 책 두께
  const zOf = i => (L - i) * K + 4;

  const floor = el('div', 'floor'); floor.style.transform = 'translateZ(-30px)'; book.appendChild(floor);
  const board = el('div', 'board cover-face'); board.style.transform = 'translateZ(0px)'; book.appendChild(board);
  const er = el('div', 'edge-r'); Object.assign(er.style, { left: W + 'px', width: T + 'px', transform: `translateZ(${zOf(1)}px) rotateY(90deg)` }); book.appendChild(er);
  const et = el('div', 'edge-t'); Object.assign(et.style, { top: '0px', height: T + 'px', transform: `translateZ(${zOf(1) - T}px) rotateX(90deg)` }); book.appendChild(et);

  const emblem = `<svg class="cemblem" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="100" r="92" stroke-width="3"/><circle cx="100" cy="100" r="80" stroke-width="1.5" opacity=".7"/>
    <path d="M52 128c18-6 26-26 44-26s20 18 38 14 14-26 2-34"/><path d="M136 82c8-10 22-8 24 2"/><circle cx="148" cy="80" r="2.5" fill="currentColor"/>
    <path d="M70 70c4-14 18-22 30-20-4 12-16 22-30 20z" fill="currentColor" opacity=".9"/><path d="M100 50c0 10-6 18-14 20"/>
    <path d="M60 148c26 10 54 10 80 0" opacity=".8"/><path d="M74 160c18 6 34 6 52 0" opacity=".6"/></svg>`;

  const leaves = [];
  function addLeaf(frontHTML, backHTML, isCover) {
    const leaf = el('div', 'leaf');
    const f = el('div', isCover ? 'cover-face front' : 'face front', frontHTML);
    const b = el('div', isCover ? 'cover-face back' : 'face back', backHTML);
    const fs = el('div', 'shade'), bs = el('div', 'shade'), cast = el('div', 'cast');
    if (isCover) { fs.style.background = 'linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,.1))'; bs.style.background = 'linear-gradient(270deg, rgba(0,0,0,.45), rgba(0,0,0,.08))'; }
    f.appendChild(cast); f.appendChild(fs); b.appendChild(bs);
    leaf.append(f, b); book.appendChild(leaf);
    const o = { leaf, f, b, fs, bs, cast, i: leaves.length };
    leaves.push(o); return o;
  }
  const C = A.cover;
  addLeaf(`<div class="spine"></div><div class="frame"></div><div class="ctext">
      <div class="ckicker">${esc(C.kicker)}</div>${emblem}
      <div class="ctitle">${esc(C.title)}</div><div class="csub">${esc(C.subtitle)}</div>
      <div class="corg">${esc(C.org)}</div><div class="cyear">${esc(C.year)}</div></div>`,
    `<div class="endpaper"></div>`, true);

  const backHTML = `<div class="paper back-side"><div class="backdeco"></div><div class="backmark">${esc(C.title)}</div></div>`;
  pages.forEach((p, i) => {
    const rot = [-2.2, 1.8, -1.2, 2.4, -1.8][i % 5];
    const media = p.video
      ? (isRender ? `<img alt="">` : `<video muted playsinline preload="auto" src="${esc(p.media)}"></video>`) + `<div class="vtag">▶ VIDEO</div>`
      : `<img alt="" src="${esc(p.media)}">`;
    const o = addLeaf(`<div class="paper">
        <div class="phead"><span><i class="dot"></i>BEHIND ALBUM</span><span>${esc(C.title)}</span></div>
        <div class="polaroid" style="--r:${rot}deg"><div class="tape" style="--tape:${TAPES[i % TAPES.length]}"></div><div class="photo">${media}</div></div>
        <div class="ptext"><div class="ptitle">${esc(p.title)}</div><div class="prule"></div><div class="pbody">${esc(p.body)}</div></div>
        <div class="pno">PAGE <b>${pad(p.page)}</b></div></div>`, backHTML);
    o.page = p; o.rot = rot;
    o.pol = o.f.querySelector('.polaroid'); o.ttl = o.f.querySelector('.ptitle'); o.rule = o.f.querySelector('.prule');
    o.body = o.f.querySelector('.pbody'); o.pno = o.f.querySelector('.pno'); o.tape = o.f.querySelector('.tape');
    o.media = o.f.querySelector('.photo img, .photo video');
    if (p.fit) o.media.style.objectFit = p.fit;
  });
  const O = A.outro || {};
  const out = addLeaf(`<div class="paper"><div class="outro">
      <div class="otitle">${esc(O.title)}</div><div class="obody">${esc(O.body)}</div>
      <div class="stamp">청룡<small>${esc(C.year)}</small></div><div class="osign">${esc(O.sign)}</div></div></div>`, backHTML);
  out.items = [...out.f.querySelectorAll('.otitle, .obody, .stamp, .osign')];

  // ── 타임라인 ─────────────────────────────────
  let TL, DURATION;
  function buildTimeline() {
    TL = []; let t = TM.intro + TM.coverHold;
    TL.push({ flip: t });                                     // leaf 0 = 표지
    t += TM.flip;
    leaves.forEach((o, i) => {
      if (i === 0) return;
      o.active = t;
      if (o.page) {
        const p = o.page;
        let hold = p.duration ?? (p.video ? Math.min(TM.videoMax, (o.vdur || TM.pageHold) - (p.start || 0)) : TM.pageHold);
        o.hold = hold;
        TL.push({ flip: t + hold }); t += hold + TM.flip;
      } else { o.hold = TM.outroHold; t += TM.outroHold; }
    });
    DURATION = t + 0.4;
    window.ALBUM_DURATION = DURATION;
  }

  // ── 프레임 그리기 ────────────────────────────
  const pending = [];
  function renderAt(t) {
    pending.length = 0;
    // 배경
    blobs.forEach((o, i) => { o.b.style.transform = `translate(${o.x - o.s / 2 + Math.sin(t * .4 + i) * 40}px, ${o.y - o.s / 2 + Math.cos(t * .33 + i * 2) * 50}px)`; });
    sparks.forEach(o => { const y = ((o.y - t * o.sp) % 2000 + 2000) % 2000 - 40;
      Object.assign(o.s.style, { width: o.r + 'px', height: o.r + 'px', opacity: o.o * (.6 + .4 * Math.sin(t * 2 + o.ph)),
        transform: `translate(${o.x + Math.sin(t * .8 + o.ph) * 24}px, ${y}px)` }); });

    // 카메라 / 책 등장
    const ip = eout(clamp(t / TM.intro));
    const open = eio(clamp((t - TL[0].flip) / TM.flip));
    const rx = 16 + Math.sin(t * .5) * 1.4 + (1 - ip) * 38;
    const ry = -10 + Math.sin(t * .37) * 2.2 + (1 - ip) * 34 + open * 4;
    const rz = (1 - ip) * -22;
    const tx = open * 70, ty = (1 - ip) * 1500 + Math.sin(t * .6) * 6 - open * 10;
    const tz = (1 - ip) * -500 - 120 + open * 30;
    book.style.transform = `translate3d(${tx}px, ${ty}px, ${tz}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;

    // 표지 금박 반짝
    const ct = book.querySelector('.ctitle');
    ct.style.backgroundPosition = `${lerp(110, -10, clamp((t - TM.intro + .3) / 1.1))}% 0`;

    // 장 넘기기
    leaves.forEach((o, i) => {
      const fl = TL[i] ? clamp((t - TL[i].flip) / TM.flip) : 0;
      const e = eio(fl);
      const lift = Math.sin(fl * Math.PI) * 60;
      o.leaf.style.transform = `rotateY(${-180 * e}deg) translateZ(${zOf(i) + lift}px)`;
      o.fs.style.opacity = e * .9;
      o.bs.style.opacity = (1 - e) * .9;
      // 다음 장에 드리우는 그림자
      const prev = TL[i - 1] ? clamp((t - TL[i - 1].flip) / TM.flip) : 1;
      o.cast.style.opacity = prev > 0 && prev < 1 ? Math.sin(prev * Math.PI) * .8 * (1 - prev * .5) : 0;
    });

    // 페이지 내용 등장 애니메이션
    leaves.forEach((o, i) => {
      if (i === 0) return;
      const rs = TL[i - 1].flip + TM.flip * .45;     // 앞장이 넘어가는 도중부터 등장
      const k = x => clamp((t - rs - x) / .55);
      if (o.page) {
        const a = eback(k(0)), b = eout(k(.25)), r = eout(k(.45)), c = eout(k(.55)), d = eout(k(.75));
        o.pol.style.transform = `translateX(-50%) translateY(${(1 - a) * 60}px) rotate(${o.rot + (1 - a) * 8}deg) scale(${.9 + .1 * a})`;
        o.pol.style.opacity = clamp(k(0) * 2.5);
        o.tape.style.transform = `rotate(-3deg) scaleX(${eout(k(.3))})`;
        o.ttl.style.transform = `translateY(${(1 - b) * 40}px)`; o.ttl.style.opacity = b;
        o.rule.style.transform = `scaleX(${r})`;
        o.body.style.transform = `translateY(${(1 - c) * 30}px)`; o.body.style.opacity = c; o.body.style.filter = `blur(${(1 - c) * 6}px)`;
        o.pno.style.opacity = d;
        syncVideo(o, t);
      } else {
        o.items.forEach((it, j) => { const q = eout(k(j * .25)); it.style.opacity = q;
          it.style.transform = (it.classList.contains('stamp') ? `rotate(-12deg) scale(${1.6 - .6 * eback(k(j * .25))})` : `translateY(${(1 - q) * 40}px)`); });
      }
    });

    document.getElementById('toplabel').style.opacity = clamp((t - .4) / .6);
    document.getElementById('fade').style.opacity = Math.max(1 - t / .35, clamp((t - (DURATION - .5)) / .5));
    return pending.length ? Promise.all(pending) : null;
  }

  // ── 영상 처리 ────────────────────────────────
  function syncVideo(o, t) {
    if (!o.page.video) return;
    const p = o.page, start = p.start || 0;
    const lt = clamp(t - o.active, 0, o.hold + TM.flip);
    if (R) {                                         // 렌더 모드: 미리 뽑은 프레임 이미지 사용
      const v = R.videos[p.media];
      const idx = Math.min(v.count - 1, Math.floor(lt * v.fps));
      const src = `${v.dir}/${pad(idx + 1, 5)}.jpg`;
      if (o.media.dataset.src !== src) { o.media.dataset.src = src; o.media.src = src; pending.push(o.media.decode().catch(() => {})); }
    } else {                                         // 미리보기: 실제 video 재생
      const v = o.media, want = start + lt;
      const live = t >= o.active && t < o.active + o.hold + TM.flip && playing;
      if (Math.abs(v.currentTime - want) > .3) v.currentTime = want;
      if (live && v.paused) v.play().catch(() => {});
      if (!live && !v.paused) v.pause();
    }
  }

  // ── 준비 ─────────────────────────────────────
  async function ready() {
    const texts = [A.topLabel, ...Object.values(C), ...pages.flatMap(p => [p.title, p.body]), O.title, O.body, O.sign, 'BEHIND ALBUM PAGE 0123456789 청룡 ▶ VIDEO'].join(' ');
    await Promise.all(['400 40px "Noto Sans KR"', '700 40px "Noto Sans KR"', '900 40px "Noto Sans KR"', '400 40px "Black Han Sans"', '400 40px "Gaegu"']
      .map(f => document.fonts.load(f, texts).catch(() => {})));
    await document.fonts.ready;
    await Promise.all(leaves.filter(o => o.page).map(o => {
      if (o.page.video) {
        if (R) { o.vdur = R.videos[o.page.media].duration; return; }
        return new Promise(res => { const v = o.media; if (v.readyState >= 1) { o.vdur = v.duration; res(); }
          v.addEventListener('loadedmetadata', () => { o.vdur = v.duration; res(); }, { once: true }); v.addEventListener('error', res, { once: true }); });
      }
      return o.media.decode().catch(() => {});
    }));
    buildTimeline();
  }
  window.renderAt = renderAt;

  // ── 미리보기 재생 ─────────────────────────────
  let playing = !isRender, t0 = 0, base = 0;
  function fit() { if (isRender) return; const s = Math.min(innerWidth / 1080, (innerHeight - 44) / 1920);
    stage.style.transform = `translate(${(innerWidth - 1080 * s) / 2}px, 0) scale(${s})`; }
  window.addEventListener('resize', fit); fit();

  window.albumReady = ready().then(() => {
    if (isRender) { renderAt(0); return DURATION; }
    const seek = document.getElementById('seek'), tc = document.getElementById('tc'), btn = document.getElementById('play');
    let cur = 0;
    const loop = now => {
      if (playing) { cur = base + (now - t0) / 1000; if (cur > DURATION) { base = 0; t0 = now; cur = 0; } }
      renderAt(cur); seek.value = cur / DURATION * 1000; tc.textContent = cur.toFixed(1) + 's / ' + DURATION.toFixed(1) + 's';
      requestAnimationFrame(loop);
    };
    btn.onclick = () => { playing = !playing; btn.textContent = playing ? '⏸' : '▶'; base = cur; t0 = performance.now(); };
    seek.oninput = () => { cur = base = seek.value / 1000 * DURATION; t0 = performance.now(); };
    t0 = performance.now(); requestAnimationFrame(loop);
    return DURATION;
  });
})();
</script>
